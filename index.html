<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾泽拉斯守护战 — 3D塔防</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-container"></div>

<div id="ui-root">
  <!-- 顶部状态栏 -->
  <div id="top-bar" class="wow-panel">
    <div class="stat points"><span class="stat-icon">🏅</span><span id="points-value">0</span></div>
    <div class="stat lives"><span class="stat-icon">❤️</span><span id="lives-value">20</span></div>
    <div class="stat wave"><span class="stat-icon">⚔️</span><span id="wave-value">第一关 波 0/5</span></div>
    <div class="stat kills"><span class="stat-icon">💀</span><span id="kills-value">0</span></div>
    <div class="stat env"><span id="env-value">☀️ 晴 · 08:00</span></div>
    <div class="spacer"></div>
    <button id="btn-pause" class="wow-btn square" title="暂停 (P)">⏸</button>
    <button id="btn-speed" class="wow-btn" title="游戏速度">▶ 1x</button>
    <button id="btn-mute" class="wow-btn square" title="音效开关">🔊</button>
  </div>

  <!-- 召唤下一波按钮 -->
  <button id="btn-wave" class="wow-btn big hidden">⚔ 开始第 1 波</button>
  <div id="wave-timer" class="hidden"></div>

  <!-- 波次横幅 -->
  <div id="banner" class="hidden"></div>

  <!-- 提示气泡 -->
  <div id="toast" class="hidden"></div>

  <!-- 选中塔面板（仅查看属性） -->
  <div id="tower-panel" class="wow-panel hidden">
    <div id="tp-head">
      <div id="tp-portrait"></div>
      <div>
        <div id="tp-name">亡灵法师</div>
        <div id="tp-level">★☆☆☆</div>
      </div>
      <button id="tp-close" class="wow-btn square">✕</button>
    </div>
    <div id="tp-stats"></div>
    <div id="tp-desc"></div>
    <div id="tp-xp">
      <div id="tp-xp-bar"><div id="tp-xp-fill"></div></div>
      <span id="tp-xp-text"></span>
    </div>
  </div>

  <!-- 提示栏 -->
  <div id="hint-bar"></div>

  <!-- 英雄布阵界面 -->
  <div id="arrange-screen" class="screen hidden">
    <div class="wow-panel screen-box">
      <div class="screen-title">英雄布阵</div>
      <div class="screen-sub">四位英雄驻守暴风城大门城墙 —— 点击两张卡牌交换站位</div>
      <div id="squad-arrange" class="squad-row"></div>
      <button id="btn-start-game" class="wow-btn big">▶ 开始第 1 关</button>
    </div>
  </div>

  <!-- 关卡结算界面 -->
  <div id="level-screen" class="screen hidden">
    <div class="wow-panel screen-box">
      <div class="screen-title" id="level-title">第一关 完成！</div>
      <div class="screen-sub" id="level-sub"></div>
      <div id="squad-level" class="squad-row"></div>
      <div class="screen-hint">✨ 击杀获得经验，经验条满自动圣光升级　·　🏅 积分可为英雄购买经验　·　点击两张卡交换站位</div>
      <button id="btn-next-level" class="wow-btn big">▶ 开启下一关</button>
    </div>
  </div>

  <!-- 结算界面 -->
  <div id="end-screen" class="hidden">
    <div id="end-box" class="wow-panel">
      <div id="end-title">胜利</div>
      <div id="end-sub"></div>
      <div id="end-stats"></div>
      <button id="btn-restart" class="wow-btn big">🔁 再来一局</button>
    </div>
  </div>

  <div id="pause-mask" class="hidden"><div>⏸ 已暂停 — 按 P 继续</div></div>
</div>

<script src="js/three.min.js"></script>
<!-- Bloom 后处理（three r147 examples 本地 UMD，无构建依赖） -->
<script src="js/lib/CopyShader.js"></script>
<script src="js/lib/LuminosityHighPassShader.js"></script>
<script src="js/lib/EffectComposer.js"></script>
<script src="js/lib/RenderPass.js"></script>
<script src="js/lib/ShaderPass.js"></script>
<script src="js/lib/UnrealBloomPass.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/world.js"></script>
<script src="js/characters.js"></script>
<script src="js/effects.js"></script>
<script src="js/environment.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
